<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5ed">


    <meta
      name="description"
      content="{{DESCRIPTION}}"
    >


    <title>Programmes · {{TITLE}}</title>


    <link rel="stylesheet" href="../styles.css">


    <script src="./{{DATAFILE}}" defer></script>
    <script src="../catalogue.js" defer></script>
    <script src="../navigation.js" defer></script>
  </head>


  <body>
    <header class="topbar topbar-with-statistics">


      <a
        class="wordmark"
        href="index.html"
        aria-label="Catalogue : {{TITLE}}"
      >
        <span class="wordmark-mark" aria-hidden="true">{{LETTER}}</span>
        <span>{{TITLE_UPPER}}</span>
      </a>
      <nav
        class="topbar-links"
        data-navigation
        aria-label="Navigation secondaire"
      ></nav>


      <span
        class="edition domain-statistics"
        id="domain-statistics"
      >
        —
      </span>


    </header>


    <main class="catalogue-layout">


      <aside
        class="course-sidebar"
        aria-label="Rubriques : {{TITLE}}"
      >
        <p class="sidebar-label">LES BRANCHES</p>


        <nav
          class="catalogue-levels"
          id="catalogue-levels"
        ></nav>


        <div class="sidebar-note">
          <span class="note-mark" aria-hidden="true">{{LETTER}}</span>
          <p>
            {{DESCRIPTION}} :
            choisis une rubrique et explore ses chapitres.
          </p>
        </div>
      </aside>


      <article class="catalogue-content">


        <header class="course-heading catalogue-heading">
          <p class="eyebrow">
            <span class="status-dot" aria-hidden="true"></span>
            BIBLIOTHÈQUE · {{TITLE_UPPER}}
          </p>


          <h1 class="is-long-title">
            Explorer<br>
            <span>{{TITLE}}</span>
          </h1>


          <p class="course-intro">
            {{DESCRIPTION}}
          </p>


          <div class="course-meta">
            <span id="catalogue-count">
              —
            </span>
          </div>
        </header>


        <div id="programme-sections"></div>


        <footer class="course-footer">
          <span>{{TITLE_UPPER}}</span>
          <a href="../index.html">Retour à l’accueil ↑</a>
        </footer>


      </article>
    </main>
  </body>
</html>
