<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5ed">

    <meta name="description" content="{{DESCRIPTION}}">

    <title>{{TITLE}}</title>

    <link rel="stylesheet" href="../styles.css">

    <script src="./{{DATAFILE}}" defer></script>
    <script src="../cours.js" defer></script>
    <script src="../navigation.js" defer></script>
  </head>

  <body data-course-label="{{TITLE}}">
    <header class="topbar">

      <a
        class="wordmark"
        href="index.html"
        aria-label="Retour au catalogue : {{TITLE}}"
      >
        <span class="wordmark-mark" aria-hidden="true">{{LETTER}}</span>
        <span>{{TITLE_UPPER}}</span>
      </a>

      <nav
        class="topbar-links"
        data-navigation
        aria-label="Navigation secondaire"
      ></nav>

    </header>

    <div class="reading-track" aria-hidden="true">
      <span id="reading-progress"></span>
    </div>

    <main class="lesson-layout">
      <aside
        class="course-sidebar"
        aria-label="Navigation de la branche"
      >
        <p class="sidebar-label">
          <a id="lesson-level-label" href="index.html">{{TITLE_UPPER}}</a>
        </p>

        <nav
          class="chapter-nav"
          id="lesson-chapter-nav"
        ></nav>

        <div class="sidebar-note">
          <span class="note-mark" aria-hidden="true">{{LETTER}}</span>
          <p>
            Choisis un autre chapitre de cette branche ou retourne
            au catalogue général.
          </p>
        </div>
      </aside>

      <article class="course-content">
        <header class="course-heading">
          <p class="eyebrow">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="lesson-eyebrow">FICHE · {{TITLE_UPPER}}</span>
          </p>

          <h1 id="lesson-title">{{TITLE}}</h1>
          <p class="course-intro" id="lesson-summary"></p>

          <div class="course-meta">
            <span id="lesson-field"></span>
            <span id="lesson-level"></span>
          </div>
        </header>

        <div id="chapter-lesson"></div>

        <footer class="course-footer">
          <span id="lesson-footer"></span>
          <a href="index.html">Retour aux branches ↑</a>
        </footer>
      </article>
    </main>
  </body>
</html>
