name: Deploy La connaissance to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check catalog data files
        run: |
          shopt -s nullglob
          files=(cours-*/*-data.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun fichier de catalogue trouve (cours-*/*-data.js)"
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
            echo "Syntaxe valide : $file"
          done

      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html portal.css portal.js README.md dist/
          cp -R cours-*/ dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4