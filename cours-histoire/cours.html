<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f5ed">
    <meta name="description" content="Leçon d’histoire avec notions, exemple chronologique guidé, exercices corrigés et sources.">
    <title>Cours d’histoire</title>
    <link rel="stylesheet" href="../cours-mathematiques/styles.css">
    <script src="histoire-data.js" defer></script>
    <script src="cours.js" defer></script>
  </head>
  <body data-course-label="Cours d’histoire">
    <header class="topbar">
      <a class="wordmark" href="index.html" aria-label="Retour au catalogue des cours d’histoire">
        <span class="wordmark-mark" aria-hidden="true">H</span>
        <span>LE COURS D’HISTOIRE</span>
      </a>
      <a class="edition catalogue-back" href="index.html">TOUTES LES BRANCHES ↗</a>
    </header>

    <div class="reading-track" aria-hidden="true">
      <span id="reading-progress"></span>
    </div>

    <main class="lesson-layout">
      <aside class="course-sidebar" aria-label="Navigation de la branche">
        <p class="sidebar-label">
          <a id="lesson-level-label" href="index.html">HISTOIRE</a>
        </p>
        <nav class="chapter-nav" id="lesson-chapter-nav"></nav>
        <div class="sidebar-note">
          <span class="note-mark" aria-hidden="true">H</span>
          <p>Choisis un autre chapitre de cette branche ou retourne au catalogue général.</p>
        </div>
      </aside>

      <article class="course-content">
        <header class="course-heading">
          <p class="eyebrow">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="lesson-eyebrow">FICHE D’HISTOIRE</span>
          </p>
          <h1 id="lesson-title">Cours d’histoire</h1>
          <p class="course-intro" id="lesson-summary"></p>
          <div class="course-meta">
            <span id="lesson-field"></span>
            <span id="lesson-level"></span>
          </div>
        </header>

        <div id="chapter-lesson"></div>

        <footer class="course-footer">
          <span id="lesson-footer"></span>
          <a href="index.html">Retour aux branches ↑</a>
        </footer>
      </article>
    </main>

    <!-- DIAGNOSTIC TEMPORAIRE -->
    <section id="debug-panel" style="
      margin: 24px;
      padding: 16px;
      border: 2px solid #b45309;
      border-radius: 8px;
      background: #fff8e7;
      color: #222;
      overflow-wrap: anywhere;
      font-family: monospace;
      white-space: pre-wrap;
    ">
      Chargement du diagnostic...
    </section>

    <script>
      window.addEventListener('load', function () {
        const panel = document.getElementById('debug-panel');
        const catalog = window.courseCatalog;
        const requestedId =
          new URLSearchParams(window.location.search).get('id');

        const report = {
          url: window.location.href,
          idDemande: requestedId,
          catalogueExiste: Array.isArray(catalog),
          nombreDeBranches: Array.isArray(catalog)
            ? catalog.length
            : null,
          branches: Array.isArray(catalog)
            ? catalog.map(function (branch) {
                return {
                  id: branch.id,
                  chapitres: (branch.chapters || []).map(function (chapter) {
                    return chapter.id;
                  })
                };
              })
            : null,
          chapitreRecherche: Array.isArray(catalog)
            ? catalog
                .flatMap(function (branch) {
                  return branch.chapters || [];
                })
                .find(function (chapter) {
                  return chapter.id === requestedId;
                }) || null
            : null
        };

        panel.textContent =
          'DIAGNOSTIC TEMPORAIRE\n\n' +
          JSON.stringify(report, null, 2);
      });
    </script>
  </body>
</html>
